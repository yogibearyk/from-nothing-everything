<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Hardest Test: 2,500 Data Points, Zero Knobs</text>
  <!-- Simplified CMB power spectrum -->
  <g transform="translate(50,40)">
    <!-- Axes -->
    <line x1="30" y1="160" x2="420" y2="160" stroke="#ccc" stroke-width="1"/>
    <line x1="30" y1="10" x2="30" y2="160" stroke="#ccc" stroke-width="1"/>
    <text x="225" y="185" text-anchor="middle" font-size="11" fill="#999">angular scale (ℓ = 2 → 2500)</text>
    <text x="15" y="85" text-anchor="middle" font-size="10" fill="#999" transform="rotate(-90,15,85)">ripple strength</text>
    <!-- Stylized TT spectrum with peaks -->
    <path d="M35,140 Q50,130 70,100 Q90,50 110,30 Q130,50 150,80 Q170,100 190,70 Q210,45 230,55 Q250,70 270,65 Q290,55 310,60 Q330,65 350,68 Q370,72 390,80 Q400,85 410,90" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <!-- Planck data (dots) -->
    <g fill="#dc2626" opacity="0.5">
      <circle cx="70" cy="102" r="2.5"/><circle cx="90" cy="52" r="2.5"/>
      <circle cx="110" cy="32" r="2.5"/><circle cx="130" cy="52" r="2.5"/>
      <circle cx="150" cy="82" r="2.5"/><circle cx="170" cy="102" r="2.5"/>
      <circle cx="190" cy="72" r="2.5"/><circle cx="210" cy="47" r="2.5"/>
      <circle cx="230" cy="57" r="2.5"/><circle cx="250" cy="72" r="2.5"/>
      <circle cx="270" cy="67" r="2.5"/><circle cx="290" cy="57" r="2.5"/>
      <circle cx="310" cy="62" r="2.5"/><circle cx="330" cy="67" r="2.5"/>
      <circle cx="350" cy="70" r="2.5"/><circle cx="370" cy="74" r="2.5"/>
      <circle cx="390" cy="82" r="2.5"/>
    </g>
    <!-- Legend -->
    <line x1="300" y1="15" x2="330" y2="15" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="335" y="19" font-size="10" fill="#3b82f6">framework (zero parameters)</text>
    <circle cx="315" cy="32" r="2.5" fill="#dc2626" opacity="0.5"/>
    <text x="335" y="36" font-size="10" fill="#dc2626">Planck satellite data</text>
  </g>
  <!-- Result -->
  <rect x="100" y="210" width="300" height="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="250" y="230" text-anchor="middle" font-size="13" fill="#166534">indistinguishable within cosmic variance</text>
</svg>
