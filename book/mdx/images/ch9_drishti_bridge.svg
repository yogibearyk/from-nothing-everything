<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Drishti Bridge: How Much Can Be Seen?</text>
  <!-- The whole -->
  <rect x="50" y="50" width="400" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="5"/>
  <text x="250" y="75" text-anchor="middle" font-size="14" fill="#64748b">total content = 1</text>
  <!-- The split -->
  <rect x="50" y="120" width="206" height="40" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="153" y="145" text-anchor="middle" font-size="13" fill="white">examined (Maya)</text>
  <rect x="256" y="120" width="194" height="40" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" rx="5"/>
  <text x="353" y="145" text-anchor="middle" font-size="13" fill="white">examiner (Chakra)</text>
  <!-- The bound -->
  <text x="153" y="180" text-anchor="middle" font-size="12" fill="#1d4ed8">φ⁻¹ ≈ 61.8%</text>
  <text x="353" y="180" text-anchor="middle" font-size="12" fill="#4f46e5">1 − φ⁻¹ ≈ 38.2%</text>
  <!-- D = φ/π -->
  <g transform="translate(250,225)">
    <rect x="-120" y="-20" width="240" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" fill="#92400e">D = φ / ⊙ ≈ 0.515</text>
  </g>
  <text x="250" y="270" text-anchor="middle" font-size="12" fill="#888">the per-position screening bound — the universe's resolution limit</text>
</svg>
