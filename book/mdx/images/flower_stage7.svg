<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="Georgia, serif">
  <rect width="500" height="440" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">Stages 6 and 7: Our Universe and the Dark Sector</text>
  <text x="250" y="45" text-anchor="middle" font-size="12" fill="#999">13 petals = 8 (visible) + 5 (dark) — the Fibonacci growth of reality</text>
  
  <!-- Center hub: Ω -->
  <circle cx="250" cy="210" r="16" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="215" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Ω</text>
  <polygon points="296,321 237,215 263,205" fill="#4f46e5" opacity="0.25" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="303" y="338" text-anchor="middle" font-size="10" fill="#6366f1">9</text>
  <polygon points="141,159 256,197 244,223" fill="#4f46e5" opacity="0.25" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="125" y="152" text-anchor="middle" font-size="10" fill="#6366f1">10</text>
  <polygon points="364,174 254,223 246,197" fill="#4f46e5" opacity="0.25" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="382" y="169" text-anchor="middle" font-size="10" fill="#6366f1">11</text>
  <polygon points="190,314 238,203 262,217" fill="#4f46e5" opacity="0.25" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="181" y="329" text-anchor="middle" font-size="10" fill="#6366f1">12</text>
  <polygon points="224,93 264,207 236,213" fill="#4f46e5" opacity="0.25" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="220" y="75" text-anchor="middle" font-size="10" fill="#6366f1">13</text>
  <polygon points="301,265 240,219 260,201" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="311" y="277" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="normal">1</text>
  <polygon points="175,203 251,196 249,224" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="159" y="202" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="normal">2</text>
  <polygon points="310,164 259,221 241,199" fill="#dc2626" opacity="0.55" stroke="#dc2626" stroke-width="2"/>
  <text x="322" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="bold">3</text>
  <polygon points="237,284 236,208 264,212" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="234" y="300" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="normal">4</text>
  <polygon points="210,147 262,202 238,218" fill="#dc2626" opacity="0.55" stroke="#dc2626" stroke-width="2"/>
  <text x="201" y="133" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="bold">5</text>
  <polygon points="322,229 246,224 254,196" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="338" y="234" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="normal">6</text>
  <polygon points="183,245 244,198 256,222" fill="#dc2626" opacity="0.55" stroke="#dc2626" stroke-width="2"/>
  <text x="169" y="252" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="bold">7</text>
  <polygon points="276,140 263,215 237,205" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="281" y="125" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="normal">8</text>
  <line x1="296" y1="260" x2="289" y2="304" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="183" y1="204" x2="158" y2="167" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="304" y1="169" x2="347" y2="179" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="238" y1="276" x2="199" y2="298" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="214" y1="153" x2="228" y2="110" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <g transform="translate(30,360)">
    <polygon points="10,0 2,18 18,18" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <text x="28" y="14" font-size="11" fill="#555">visible matter (stage 6)</text>
  </g>
  <g transform="translate(30,382)">
    <polygon points="10,0 2,18 18,18" fill="#dc2626" opacity="0.55" stroke="#dc2626" stroke-width="1.5"/>
    <text x="28" y="14" font-size="11" fill="#555">bridge positions (3, 5, 7) → 3 spatial dimensions</text>
  </g>
  <g transform="translate(30,404)">
    <polygon points="10,0 2,18 18,18" fill="#4f46e5" opacity="0.25" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="28" y="14" font-size="11" fill="#555">dark sector (stage 7) — screened from view, gravitationally real</text>
  </g>
  
  <text x="250" y="435" text-anchor="middle" font-size="11" fill="#888">the flower grows: 8 → 13 petals = 8 + 5 (Fibonacci), adding the dark sector as an outer ring</text>
</svg>