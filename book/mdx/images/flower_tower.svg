<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Georgia, serif">
  <rect width="500" height="400" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Tower as a Flower</text>
  
  <!-- Center hub -->
  <circle cx="250" cy="190" r="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="bold">Ω</text>
  
  <!-- 8 triangular petals at golden angle increments (137.508°) -->
  <!-- Petal 1: 0° -->
  <polygon points="250,190 230,100 270,100" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="115" text-anchor="middle" font-size="10" fill="#1d4ed8">1</text>
  
  <!-- Petal 2: 137.5° -->
  <polygon points="250,190 170,230 160,185" fill="#3b82f6" opacity="0.35" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="210" text-anchor="middle" font-size="10" fill="#1d4ed8">2</text>
  
  <!-- Petal 3: 275° (bridge!) -->
  <polygon points="250,190 310,270 280,280" fill="#dc2626" opacity="0.5" stroke="#dc2626" stroke-width="2"/>
  <text x="295" y="265" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">3</text>
  
  <!-- Petal 4: 52.5° -->
  <polygon points="250,190 320,130 330,170" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="155" text-anchor="middle" font-size="10" fill="#1d4ed8">4</text>
  
  <!-- Petal 5: 190° (bridge!) -->
  <polygon points="250,190 220,280 195,260" fill="#dc2626" opacity="0.5" stroke="#dc2626" stroke-width="2"/>
  <text x="215" y="270" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">5</text>
  
  <!-- Petal 6: 327.5° -->
  <polygon points="250,190 335,215 320,245" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" font-size="10" fill="#1d4ed8">6</text>
  
  <!-- Petal 7: 105° (bridge!) -->
  <polygon points="250,190 180,130 195,105" fill="#dc2626" opacity="0.5" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="125" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">7</text>
  
  <!-- Petal 8: 242.5° -->
  <polygon points="250,190 210,240 190,220" fill="#f59e0b" opacity="0.4" stroke="#d97706" stroke-width="1.5"/>
  <text x="205" y="230" text-anchor="middle" font-size="10" fill="#92400e">8</text>
  
  <!-- Golden angle arc -->
  <path d="M250,140 A50,50 0 0,1 205,175" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="215" y="148" font-size="9" fill="#888">137.5°</text>
  
  <!-- Legend -->
  <g transform="translate(50,330)">
    <polygon points="0,0 -8,18 8,18" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
    <text x="18" y="14" font-size="11" fill="#555">non-bridge positions</text>
    <polygon points="200,0 192,18 208,18" fill="#dc2626" opacity="0.5" stroke="#dc2626" stroke-width="1.5"/>
    <text x="218" y="14" font-size="11" fill="#555">bridge positions (3, 5, 7)</text>
  </g>
  
  <text x="250" y="370" text-anchor="middle" font-size="12" fill="#888">each petal placed at the golden angle — the same rule as sunflower seeds</text>
  <text x="250" y="388" text-anchor="middle" font-size="11" fill="#aaa">the hard-core constraint becomes geometry</text>
</svg>
