<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, serif">
  <!-- The featureless ground: a subtle gradient circle -->
  <defs>
    <radialGradient id="omega_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="70%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <!-- The circle of Ω — featureless, undifferentiated -->
  <circle cx="200" cy="130" r="90" fill="url(#omega_glow)" stroke="#aaa" stroke-width="1.5"/>
  <!-- The symbol -->
  <text x="200" y="140" text-anchor="middle" font-size="42" fill="#555" font-style="italic">Ω</text>
  <!-- The identity -->
  <text x="200" y="240" text-anchor="middle" font-size="18" fill="#777">0 = 1 = ∞</text>
  <text x="200" y="268" text-anchor="middle" font-size="13" fill="#999">no shape · no time · no distinction</text>
</svg>
