<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Scorecard: 50 Predictions, Average Pull 0.48σ</text>
  <!-- Histogram of pulls -->
  <g transform="translate(70,50)">
    <!-- Axes -->
    <line x1="0" y1="180" x2="360" y2="180" stroke="#ccc" stroke-width="1"/>
    <line x1="180" y1="10" x2="180" y2="180" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="180" y="200" text-anchor="middle" font-size="11" fill="#999">pull (σ) from measurement</text>
    <text x="0" y="198" font-size="10" fill="#999">−2σ</text>
    <text x="90" y="198" font-size="10" fill="#999">−1σ</text>
    <text x="180" y="198" font-size="10" fill="#999">0</text>
    <text x="270" y="198" font-size="10" fill="#999">+1σ</text>
    <text x="360" y="198" font-size="10" fill="#999">+2σ</text>
    <!-- Bars (approximate distribution) -->
    <rect x="90" y="140" width="30" height="40" fill="#3b82f6" opacity="0.6" rx="2"/>
    <rect x="120" y="100" width="30" height="80" fill="#3b82f6" opacity="0.7" rx="2"/>
    <rect x="150" y="40" width="30" height="140" fill="#3b82f6" opacity="0.8" rx="2"/>
    <rect x="180" y="50" width="30" height="130" fill="#3b82f6" opacity="0.8" rx="2"/>
    <rect x="210" y="70" width="30" height="110" fill="#3b82f6" opacity="0.7" rx="2"/>
    <rect x="240" y="120" width="30" height="60" fill="#3b82f6" opacity="0.6" rx="2"/>
    <rect x="270" y="150" width="30" height="30" fill="#3b82f6" opacity="0.5" rx="2"/>
    <!-- Count labels -->
    <text x="165" y="35" text-anchor="middle" font-size="10" fill="#1d4ed8">most predictions</text>
    <text x="165" y="48" text-anchor="middle" font-size="10" fill="#1d4ed8">cluster near zero</text>
  </g>
  <!-- Summary stats -->
  <g transform="translate(50,260)" font-size="12">
    <text x="0" y="0" fill="#555">31/32 testable within 2σ</text>
    <text x="200" y="0" fill="#555">average |pull| = 0.48σ</text>
    <text x="390" y="0" fill="#16a34a" font-weight="bold">0 knobs</text>
  </g>
</svg>
