<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="30" text-anchor="middle" font-size="15" fill="#444">The Only Ruler Is the Stick Itself</text>
  <!-- The whole stick -->
  <rect x="50" y="60" width="400" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" rx="3"/>
  <text x="250" y="55" text-anchor="middle" font-size="12" fill="#666">whole = 1</text>
  <!-- The split -->
  <rect x="50" y="110" width="247" height="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" rx="3"/>
  <rect x="297" y="110" width="153" height="20" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="173" y="105" text-anchor="middle" font-size="12" fill="#1d4ed8">observed = φ⁻¹ ≈ 0.618</text>
  <text x="373" y="105" text-anchor="middle" font-size="12" fill="#d97706">observer ≈ 0.382</text>
  <!-- The ratios -->
  <line x1="120" y1="150" x2="120" y2="175" stroke="#888" stroke-width="1"/>
  <line x1="350" y1="150" x2="350" y2="175" stroke="#888" stroke-width="1"/>
  <text x="250" y="172" text-anchor="middle" font-size="13" fill="#555">whole/observed = observed/observer = φ ≈ 1.618</text>
  <!-- Self-similar subdivision -->
  <rect x="50" y="205" width="153" height="14" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1" rx="2" opacity="0.7"/>
  <rect x="203" y="205" width="94" height="14" fill="#f59e0b" stroke="#d97706" stroke-width="1" rx="2" opacity="0.7"/>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#888">same ratio at every level — self-similar</text>
</svg>
