<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Georgia, serif">
  <rect width="500" height="300" fill="#fafafa"/>
  <!-- Before: featureless Ω -->
  <g transform="translate(120,140)">
    <circle r="55" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" font-size="28" fill="#888" font-style="italic">Ω</text>
    <text y="85" text-anchor="middle" font-size="12" fill="#999">before</text>
  </g>
  <!-- Arrow -->
  <line x1="195" y1="140" x2="275" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6" fill="#aaa"/></marker></defs>
  <text x="235" y="125" text-anchor="middle" font-size="11" fill="#999">first act</text>
  <!-- After: the distinction — a sphere with a diameter -->
  <g transform="translate(370,140)">
    <circle r="55" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- The diameter — the first distinction -->
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#dc2626" stroke-width="2"/>
    <!-- Labels -->
    <text y="-30" text-anchor="middle" font-size="11" fill="#2563eb">circumference</text>
    <text y="16" text-anchor="middle" font-size="11" fill="#dc2626">diameter</text>
    <!-- The ratio -->
    <text y="85" text-anchor="middle" font-size="14" fill="#555">⊙ = circumference / diameter</text>
  </g>
  <text x="250" y="32" text-anchor="middle" font-size="16" fill="#444">The First Distinction Creates ⊙</text>
</svg>
