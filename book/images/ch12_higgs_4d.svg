<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">Stage 6: 8 Positions → 4 Dimensions</text>
  <!-- 8 positions -->
  <g transform="translate(50,70)">
    <text x="0" y="-5" font-size="12" fill="#999">8 tower positions:</text>
    <g transform="translate(0,15)">
      <!-- 3 bridge = spatial -->
      <rect x="0" y="0" width="45" height="30" fill="#e2e8f0" rx="4" stroke="#94a3b8"/>
      <text x="22" y="20" text-anchor="middle" font-size="11" fill="#64748b">1</text>
      <rect x="50" y="0" width="45" height="30" fill="#e2e8f0" rx="4" stroke="#94a3b8"/>
      <text x="72" y="20" text-anchor="middle" font-size="11" fill="#64748b">2</text>
      <rect x="100" y="0" width="45" height="30" fill="#dc2626" rx="4" stroke="#b91c1c"/>
      <text x="122" y="20" text-anchor="middle" font-size="11" fill="white">3</text>
      <rect x="150" y="0" width="45" height="30" fill="#e2e8f0" rx="4" stroke="#94a3b8"/>
      <text x="172" y="20" text-anchor="middle" font-size="11" fill="#64748b">4</text>
      <rect x="200" y="0" width="45" height="30" fill="#dc2626" rx="4" stroke="#b91c1c"/>
      <text x="222" y="20" text-anchor="middle" font-size="11" fill="white">5</text>
      <rect x="250" y="0" width="45" height="30" fill="#e2e8f0" rx="4" stroke="#94a3b8"/>
      <text x="272" y="20" text-anchor="middle" font-size="11" fill="#64748b">6</text>
      <rect x="300" y="0" width="45" height="30" fill="#dc2626" rx="4" stroke="#b91c1c"/>
      <text x="322" y="20" text-anchor="middle" font-size="11" fill="white">7</text>
      <rect x="350" y="0" width="45" height="30" fill="#f59e0b" rx="4" stroke="#d97706"/>
      <text x="372" y="20" text-anchor="middle" font-size="11" fill="white">8</text>
    </g>
  </g>
  <!-- Arrow down -->
  <text x="250" y="130" text-anchor="middle" font-size="18" fill="#aaa">↓ Higgs resolution ↓</text>
  <!-- 4 dimensions -->
  <g transform="translate(80,160)">
    <rect x="0" y="0" width="80" height="35" fill="#dc2626" rx="6" stroke="#b91c1c"/>
    <text x="40" y="22" text-anchor="middle" font-size="12" fill="white">x</text>
    <rect x="90" y="0" width="80" height="35" fill="#dc2626" rx="6" stroke="#b91c1c"/>
    <text x="130" y="22" text-anchor="middle" font-size="12" fill="white">y</text>
    <rect x="180" y="0" width="80" height="35" fill="#dc2626" rx="6" stroke="#b91c1c"/>
    <text x="220" y="22" text-anchor="middle" font-size="12" fill="white">z</text>
    <rect x="270" y="0" width="80" height="35" fill="#f59e0b" rx="6" stroke="#d97706"/>
    <text x="310" y="22" text-anchor="middle" font-size="12" fill="white">time</text>
  </g>
  <text x="120" y="215" font-size="11" fill="#dc2626">3 bridges → 3 spatial dimensions</text>
  <text x="310" y="215" font-size="11" fill="#d97706">1 Higgs → time</text>
  <text x="250" y="240" text-anchor="middle" font-size="12" fill="#888">⌈F(6)/2⌉ = ⌈8/2⌉ = 4 dimensions</text>
</svg>
