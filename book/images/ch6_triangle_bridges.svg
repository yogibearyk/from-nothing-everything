<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Georgia, serif">
  <rect width="500" height="300" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Triangle: Three Bridges Connect the Tower</text>
  <!-- The 8-position tower at stage 6 -->
  <g transform="translate(100,50)">
    <text x="0" y="0" font-size="12" fill="#999">Stage 6: 8 positions</text>
    <!-- Positions as circles in a line -->
    <g transform="translate(0,25)">
      <circle cx="0" cy="0" r="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" fill="#64748b">1</text>
      <circle cx="40" cy="0" r="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="40" y="5" text-anchor="middle" font-size="11" fill="#64748b">2</text>
      <!-- Bridge 3 -->
      <circle cx="80" cy="0" r="15" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
      <text x="80" y="5" text-anchor="middle" font-size="11" fill="white" font-weight="bold">3</text>
      <circle cx="120" cy="0" r="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="120" y="5" text-anchor="middle" font-size="11" fill="#64748b">4</text>
      <!-- Bridge 5 -->
      <circle cx="160" cy="0" r="15" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
      <text x="160" y="5" text-anchor="middle" font-size="11" fill="white" font-weight="bold">5</text>
      <circle cx="200" cy="0" r="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="200" y="5" text-anchor="middle" font-size="11" fill="#64748b">6</text>
      <!-- Bridge 7 -->
      <circle cx="240" cy="0" r="15" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
      <text x="240" y="5" text-anchor="middle" font-size="11" fill="white" font-weight="bold">7</text>
      <circle cx="280" cy="0" r="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="280" y="5" text-anchor="middle" font-size="11" fill="#64748b">8</text>
    </g>
  </g>
  <!-- The triangle formed by bridges 3, 5, 7 -->
  <g transform="translate(250,200)">
    <!-- Triangle -->
    <polygon points="0,-60 -70,40 70,40" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <!-- Bridge nodes -->
    <circle cx="0" cy="-60" r="18" fill="#dc2626"/><text x="0" y="-55" text-anchor="middle" font-size="13" fill="white" font-weight="bold">3</text>
    <circle cx="-70" cy="40" r="18" fill="#dc2626"/><text x="-70" y="45" text-anchor="middle" font-size="13" fill="white" font-weight="bold">5</text>
    <circle cx="70" cy="40" r="18" fill="#dc2626"/><text x="70" y="45" text-anchor="middle" font-size="13" fill="white" font-weight="bold">7</text>
    <!-- Labels -->
    <text x="0" y="-85" text-anchor="middle" font-size="12" fill="#dc2626">3 bridges = 3 spatial dimensions</text>
    <text x="0" y="75" text-anchor="middle" font-size="12" fill="#dc2626">3 bridges = SU(3) color force</text>
    <text x="0" y="92" text-anchor="middle" font-size="11" fill="#888">color and space share the same origin</text>
  </g>
</svg>
