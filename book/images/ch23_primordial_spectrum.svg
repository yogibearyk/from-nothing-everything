<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" font-family="Georgia, serif">
  <rect width="500" height="200" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Primordial Spectrum: Three Numbers</text>
  <!-- Three prediction boxes -->
  <g transform="translate(30,55)">
    <!-- n_s -->
    <rect x="0" y="0" width="140" height="100" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="bold">spectral tilt</text>
    <text x="70" y="45" text-anchor="middle" font-size="11" fill="#555">n_s = 53/55</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#888">= 0.96364</text>
    <text x="70" y="80" text-anchor="middle" font-size="10" fill="#16a34a">measured: 0.9649</text>
    <text x="70" y="95" text-anchor="middle" font-size="10" fill="#16a34a">match: 0.3σ</text>
  </g>
  <g transform="translate(180,55)">
    <!-- A_s -->
    <rect x="0" y="0" width="140" height="100" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" fill="#d97706" font-weight="bold">amplitude</text>
    <text x="70" y="45" text-anchor="middle" font-size="11" fill="#555">A_s = D̃⁸/(3·55²)</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#888">= 2.13 × 10⁻⁹</text>
    <text x="70" y="80" text-anchor="middle" font-size="10" fill="#16a34a">measured: 2.10 × 10⁻⁹</text>
    <text x="70" y="95" text-anchor="middle" font-size="10" fill="#16a34a">match: 1.0σ</text>
  </g>
  <g transform="translate(330,55)">
    <!-- r -->
    <rect x="0" y="0" width="140" height="100" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="1.5" rx="8"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" fill="#4338ca" font-weight="bold">gravitational waves</text>
    <text x="70" y="45" text-anchor="middle" font-size="11" fill="#555">r = D³</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#888">= 0.137</text>
    <text x="70" y="80" text-anchor="middle" font-size="10" fill="#f59e0b">not yet measured</text>
    <text x="70" y="95" text-anchor="middle" font-size="10" fill="#f59e0b">CMB-S4 will test</text>
  </g>
  <text x="250" y="182" text-anchor="middle" font-size="12" fill="#888">all three from φ, ⊙, and the tower — no adjustable parameters</text>
</svg>
