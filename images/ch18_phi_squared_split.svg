<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" font-family="Georgia, serif">
  <rect width="500" height="220" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">E = mc²: The Energy Budget Splits</text>
  <!-- Total budget φ² -->
  <rect x="50" y="50" width="400" height="35" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="6"/>
  <text x="250" y="73" text-anchor="middle" font-size="15" fill="white" font-weight="bold">φ² = φ + 1 = 2.618  (total budget)</text>
  <!-- Arrow -->
  <text x="250" y="105" text-anchor="middle" font-size="14" fill="#aaa">splits into ↓</text>
  <!-- Mass share -->
  <rect x="50" y="120" width="308" height="35" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="204" y="143" text-anchor="middle" font-size="14" fill="white">φ² − α_s ≈ 2.41  (mass)</text>
  <!-- Force share -->
  <rect x="358" y="120" width="92" height="35" fill="#dc2626" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="404" y="143" text-anchor="middle" font-size="13" fill="white">α_s ≈ 0.21</text>
  <!-- Labels below -->
  <text x="204" y="175" text-anchor="middle" font-size="12" fill="#1d4ed8">becomes the quark's mass</text>
  <text x="404" y="175" text-anchor="middle" font-size="11" fill="#b91c1c">stays as force</text>
  <!-- The formula -->
  <text x="250" y="207" text-anchor="middle" font-size="14" fill="#555">m_quark = m_lepton × (φ² − α_s)  ← self-referential: α_s depends on m_quark</text>
</svg>
