<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Same Structure, The Same Reason</text>
  
  <!-- Sunflower side -->
  <g transform="translate(130,130)">
    <!-- Spiral of dots suggesting seed arrangement -->
    <circle cx="0" cy="0" r="4" fill="#d97706"/>
    <circle cx="8" cy="12" r="4" fill="#d97706" opacity="0.9"/>
    <circle cx="-14" cy="5" r="4" fill="#d97706" opacity="0.85"/>
    <circle cx="6" cy="-15" r="4" fill="#d97706" opacity="0.8"/>
    <circle cx="18" cy="-3" r="4" fill="#d97706" opacity="0.75"/>
    <circle cx="-8" cy="-18" r="4" fill="#d97706" opacity="0.7"/>
    <circle cx="-20" cy="10" r="4" fill="#d97706" opacity="0.65"/>
    <circle cx="15" cy="20" r="4" fill="#d97706" opacity="0.6"/>
    <circle cx="25" cy="8" r="3.5" fill="#d97706" opacity="0.55"/>
    <circle cx="-5" cy="25" r="3.5" fill="#d97706" opacity="0.5"/>
    <circle cx="-25" cy="-8" r="3.5" fill="#d97706" opacity="0.5"/>
    <circle cx="10" cy="-25" r="3.5" fill="#d97706" opacity="0.45"/>
    <circle cx="-18" cy="-20" r="3.5" fill="#d97706" opacity="0.4"/>
    <!-- Outer ring suggesting petals -->
    <circle cx="0" cy="-42" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="30" cy="-30" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="42" cy="0" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="30" cy="30" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="0" cy="42" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="-30" cy="30" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="-42" cy="0" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <circle cx="-30" cy="-30" r="10" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
    <text x="0" y="75" text-anchor="middle" font-size="12" fill="#555">sunflower</text>
  </g>
  
  <!-- Equals sign -->
  <text x="250" y="130" text-anchor="middle" font-size="28" fill="#aaa">=</text>
  <text x="250" y="155" text-anchor="middle" font-size="11" fill="#999">same structure</text>
  
  <!-- Tower flower side -->
  <g transform="translate(370,130)">
    <circle cx="0" cy="0" r="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="0,0 -6,-40 6,-40" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="0,0 35,20 28,32" fill="#dc2626" opacity="0.4" stroke="#dc2626" stroke-width="1"/>
    <polygon points="0,0 -35,20 -28,32" fill="#dc2626" opacity="0.4" stroke="#dc2626" stroke-width="1"/>
    <polygon points="0,0 20,-35 30,-25" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="0,0 -20,-35 -30,-25" fill="#dc2626" opacity="0.4" stroke="#dc2626" stroke-width="1"/>
    <polygon points="0,0 40,-5 38,10" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="0,0 -40,-5 -38,10" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="0,0 5,40 -5,40" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <text x="0" y="65" text-anchor="middle" font-size="12" fill="#555">the tower</text>
  </g>
  
  <!-- Bottom text -->
  <text x="250" y="210" text-anchor="middle" font-size="13" fill="#555">seeds at the golden angle (137.5°) automatically satisfy the hard-core constraint</text>
  <text x="250" y="230" text-anchor="middle" font-size="12" fill="#888">the sunflower and the tower obey the same rule — for the same reason</text>
</svg>
