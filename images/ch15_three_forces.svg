<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Three Forces: One Tower, Three Readings</text>
  <!-- The tower -->
  <g transform="translate(100,60)">
    <rect x="0" y="0" width="40" height="180" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
    <text x="20" y="-8" text-anchor="middle" font-size="11" fill="#888">tower</text>
    <!-- Stage markers -->
    <line x1="0" y1="22" x2="40" y2="22" stroke="#ccc"/><text x="48" y="27" font-size="9" fill="#aaa">s=1</text>
    <line x1="0" y1="45" x2="40" y2="45" stroke="#ccc"/><text x="48" y="50" font-size="9" fill="#aaa">s=2</text>
    <line x1="0" y1="68" x2="40" y2="68" stroke="#ccc"/><text x="48" y="73" font-size="9" fill="#aaa">s=3</text>
    <line x1="0" y1="90" x2="40" y2="90" stroke="#ccc"/><text x="48" y="95" font-size="9" fill="#aaa">s=4</text>
    <line x1="0" y1="113" x2="40" y2="113" stroke="#ccc"/><text x="48" y="118" font-size="9" fill="#aaa">s=5</text>
    <line x1="0" y1="135" x2="40" y2="135" stroke="#ccc"/><text x="48" y="140" font-size="9" fill="#aaa">s=6</text>
    <line x1="0" y1="158" x2="40" y2="158" stroke="#ccc"/><text x="48" y="163" font-size="9" fill="#aaa">s=7</text>
  </g>
  <!-- Three forces as different screening depths -->
  <g transform="translate(200,60)">
    <!-- Electromagnetic -->
    <g>
      <rect x="0" y="0" width="90" height="135" fill="#3b82f6" opacity="0.15" rx="4"/>
      <rect x="0" y="0" width="90" height="135" fill="none" stroke="#3b82f6" stroke-width="2" rx="4"/>
      <text x="45" y="150" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="bold">EM</text>
      <text x="45" y="168" text-anchor="middle" font-size="11" fill="#3b82f6">α⁻¹ = 137.036</text>
      <text x="45" y="183" text-anchor="middle" font-size="10" fill="#93c5fd">6 stages deep</text>
    </g>
    <!-- Strong -->
    <g transform="translate(100,0)">
      <rect x="0" y="45" width="90" height="90" fill="#dc2626" opacity="0.15" rx="4"/>
      <rect x="0" y="45" width="90" height="90" fill="none" stroke="#dc2626" stroke-width="2" rx="4"/>
      <text x="45" y="150" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">Strong</text>
      <text x="45" y="168" text-anchor="middle" font-size="11" fill="#dc2626">α_s = 0.1179</text>
      <text x="45" y="183" text-anchor="middle" font-size="10" fill="#fca5a5">bridges only</text>
    </g>
    <!-- Weak -->
    <g transform="translate(200,0)">
      <rect x="0" y="90" width="90" height="90" fill="#f59e0b" opacity="0.15" rx="4"/>
      <rect x="0" y="90" width="90" height="90" fill="none" stroke="#f59e0b" stroke-width="2" rx="4"/>
      <text x="45" y="150" text-anchor="middle" font-size="12" fill="#d97706" font-weight="bold">Weak</text>
      <text x="45" y="168" text-anchor="middle" font-size="11" fill="#d97706">sin²θ_W = 0.231</text>
      <text x="45" y="183" text-anchor="middle" font-size="10" fill="#fcd34d">short-range</text>
    </g>
  </g>
  <text x="250" y="265" text-anchor="middle" font-size="12" fill="#888">same tower, different screening depths → different coupling strengths</text>
</svg>
