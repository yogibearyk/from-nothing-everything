<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">Why Space Has Three Dimensions</text>
  
  <!-- Stage 4: 3 petals = flat triangle (2D) -->
  <g transform="translate(90,130)">
    <polygon points="0,-45 -39,22 39,22" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="-45" r="8" fill="#3b82f6" opacity="0.6"/>
    <circle cx="-39" cy="22" r="8" fill="#3b82f6" opacity="0.6"/>
    <circle cx="39" cy="22" r="8" fill="#3b82f6" opacity="0.6"/>
    <text x="0" y="60" text-anchor="middle" font-size="12" fill="#555">3 petals</text>
    <text x="0" y="75" text-anchor="middle" font-size="11" fill="#999">flat (2D)</text>
  </g>
  
  <!-- Arrow -->
  <text x="175" y="135" font-size="22" fill="#ccc">→</text>
  
  <!-- Stage 5: 5 petals = flat pentagon (2D) -->
  <g transform="translate(250,130)">
    <polygon points="0,-45 -43,-14 -27,36 27,36 43,-14" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2"/>
    <circle cx="0" cy="-45" r="7" fill="#6366f1" opacity="0.5"/>
    <circle cx="-43" cy="-14" r="7" fill="#6366f1" opacity="0.5"/>
    <circle cx="-27" cy="36" r="7" fill="#6366f1" opacity="0.5"/>
    <circle cx="27" cy="36" r="7" fill="#6366f1" opacity="0.5"/>
    <circle cx="43" cy="-14" r="7" fill="#6366f1" opacity="0.5"/>
    <text x="0" y="60" text-anchor="middle" font-size="12" fill="#555">5 petals</text>
    <text x="0" y="75" text-anchor="middle" font-size="11" fill="#999">still flat (2D)</text>
  </g>
  
  <!-- Arrow -->
  <text x="335" y="135" font-size="22" fill="#ccc">→</text>
  
  <!-- Stage 6: 8 petals = MUST go 3D -->
  <g transform="translate(410,120)">
    <!-- Suggest 3D with overlapping circles and perspective -->
    <ellipse cx="0" cy="10" rx="55" ry="35" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
    <ellipse cx="0" cy="10" rx="35" ry="55" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- 8 dots scattered in 3D-suggesting arrangement -->
    <circle cx="0" cy="-45" r="7" fill="#dc2626" opacity="0.7"/>
    <circle cx="40" cy="-10" r="7" fill="#dc2626" opacity="0.5"/>
    <circle cx="25" cy="40" r="7" fill="#dc2626" opacity="0.4"/>
    <circle cx="-30" cy="35" r="7" fill="#dc2626" opacity="0.4"/>
    <circle cx="-45" cy="-5" r="7" fill="#dc2626" opacity="0.5"/>
    <circle cx="-15" cy="-35" r="6" fill="#dc2626" opacity="0.6"/>
    <circle cx="30" cy="-30" r="6" fill="#dc2626" opacity="0.6"/>
    <circle cx="10" cy="15" r="6" fill="#f59e0b" opacity="0.7"/>
    <text x="0" y="70" text-anchor="middle" font-size="12" fill="#555">8 petals</text>
    <text x="0" y="85" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">forced into 3D</text>
  </g>
  
  <text x="250" y="235" text-anchor="middle" font-size="13" fill="#555">8 petals at the golden angle cannot stay flat —</text>
  <text x="250" y="253" text-anchor="middle" font-size="13" fill="#555">the flower is forced into three dimensions at stage 6</text>
  <text x="250" y="273" text-anchor="middle" font-size="11" fill="#888">the flower doesn't live in 3D space — the flower is why space is 3D</text>
</svg>
