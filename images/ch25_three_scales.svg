<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Georgia, serif">
  <rect width="500" height="400" fill="#fafafa"/>
  <text x="250" y="22" text-anchor="middle" font-size="14" fill="#444">One Rule at Three Scales</text>
  
  <!-- Scale 1: Within a flower -->
  <g transform="translate(90,100)">
    <text x="0" y="-30" font-size="12" fill="#3b82f6" font-weight="bold">Within a flower</text>
    <text x="0" y="-14" font-size="10" fill="#888">the carry rule builds internal structure</text>
    <!-- Small flower -->
    <circle cx="40" cy="30" r="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="40" cy="0" r="5" fill="#3b82f6" opacity="0.5"/>
    <circle cx="58" cy="12" r="5" fill="#dc2626" opacity="0.5"/>
    <circle cx="58" cy="42" r="5" fill="#3b82f6" opacity="0.5"/>
    <circle cx="40" cy="58" r="5" fill="#dc2626" opacity="0.5"/>
    <circle cx="22" cy="42" r="5" fill="#3b82f6" opacity="0.5"/>
    <circle cx="22" cy="12" r="5" fill="#dc2626" opacity="0.5"/>
    <!-- Arrow showing carry -->
    <path d="M55,8 Q70,20 58,35" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#yarrow)"/>
    <defs><marker id="yarrow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#f59e0b"/></marker></defs>
    <text x="78" y="22" font-size="9" fill="#d97706">carry</text>
    <text x="40" y="85" text-anchor="middle" font-size="10" fill="#555">→ masses, couplings</text>
  </g>
  
  <!-- Scale 2: Between flowers -->
  <g transform="translate(210,100)">
    <text x="40" y="-30" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">Between flowers</text>
    <text x="40" y="-14" text-anchor="middle" font-size="10" fill="#888">gauge links carry forces</text>
    <!-- Two flowers connected -->
    <circle cx="10" cy="30" r="12" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="10" y="34" text-anchor="middle" font-size="16">✿</text>
    <circle cx="70" cy="30" r="12" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="34" text-anchor="middle" font-size="16">✿</text>
    <!-- Gauge link -->
    <line x1="22" y1="30" x2="58" y2="30" stroke="#dc2626" stroke-width="2"/>
    <text x="40" y="22" text-anchor="middle" font-size="8" fill="#dc2626">γ / g / W</text>
    <text x="40" y="85" text-anchor="middle" font-size="10" fill="#555">→ forces, scattering</text>
  </g>
  
  <!-- Scale 3: The lattice of flowers -->
  <g transform="translate(340,80)">
    <text x="60" y="-10" text-anchor="middle" font-size="12" fill="#6366f1" font-weight="bold">Across the lattice</text>
    <text x="60" y="6" text-anchor="middle" font-size="10" fill="#888">the lattice IS spacetime</text>
    <!-- Grid of flowers -->
    <g font-size="12" fill="#6366f1">
      <text x="20" y="40">✿</text><text x="60" y="40">✿</text><text x="100" y="40">✿</text>
      <text x="20" y="70">✿</text><text x="60" y="70">✿</text><text x="100" y="70">✿</text>
      <text x="20" y="100">✿</text><text x="60" y="100">✿</text><text x="100" y="100">✿</text>
    </g>
    <!-- Links -->
    <g stroke="#ddd" stroke-width="1">
      <line x1="30" y1="36" x2="58" y2="36"/><line x1="70" y1="36" x2="98" y2="36"/>
      <line x1="30" y1="66" x2="58" y2="66"/><line x1="70" y1="66" x2="98" y2="66"/>
      <line x1="30" y1="96" x2="58" y2="96"/><line x1="70" y1="96" x2="98" y2="96"/>
      <line x1="24" y1="44" x2="24" y2="62"/><line x1="64" y1="44" x2="64" y2="62"/>
      <line x1="104" y1="44" x2="104" y2="62"/>
      <line x1="24" y1="74" x2="24" y2="92"/><line x1="64" y1="74" x2="64" y2="92"/>
      <line x1="104" y1="74" x2="104" y2="92"/>
    </g>
    <text x="60" y="125" text-anchor="middle" font-size="10" fill="#555">→ distance, curvature</text>
  </g>
  
  <!-- The unifying principle -->
  <g transform="translate(50,270)">
    <rect x="0" y="0" width="400" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="10"/>
    <text x="200" y="25" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">The carry rule: 11 → 100</text>
    <text x="200" y="48" text-anchor="middle" font-size="12" fill="#92400e">Within: builds the flower (masses, couplings)</text>
    <text x="200" y="65" text-anchor="middle" font-size="12" fill="#92400e">Between: connects flowers (forces)</text>
  </g>
  
  <text x="250" y="380" text-anchor="middle" font-size="12" fill="#888">one operation builds the particle, connects the particles, and creates the space they inhabit</text>
</svg>
