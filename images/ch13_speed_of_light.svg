<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" font-family="Georgia, serif">
  <rect width="500" height="200" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Speed of Light: Finite, Unique, Invariant</text>
  <!-- The tower lattice -->
  <g transform="translate(50,70)">
    <text x="0" y="-10" font-size="12" fill="#999">one lattice step:</text>
    <!-- Two cells -->
    <rect x="0" y="10" width="80" height="50" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
    <text x="40" y="40" text-anchor="middle" font-size="11" fill="#64748b">cell A</text>
    <rect x="100" y="10" width="80" height="50" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
    <text x="140" y="40" text-anchor="middle" font-size="11" fill="#64748b">cell B</text>
    <!-- Signal -->
    <line x1="80" y1="35" x2="100" y2="35" stroke="#f59e0b" stroke-width="3" marker-end="url(#carrow)"/>
    <defs><marker id="carrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker></defs>
    <text x="90" y="25" text-anchor="middle" font-size="10" fill="#d97706">signal</text>
  </g>
  <!-- The formula -->
  <g transform="translate(250,85)">
    <rect x="-110" y="-25" width="220" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="0" y="0" text-anchor="middle" font-size="16" fill="#92400e">c = 8φ / ⊙</text>
    <text x="0" y="18" text-anchor="middle" font-size="10" fill="#a16207">in lattice units (one cell per tick)</text>
  </g>
  <!-- Three properties -->
  <g transform="translate(50,150)" font-size="12">
    <text x="0" y="0" fill="#3b82f6">✓ Finite</text><text x="0" y="15" fill="#888" font-size="10">the lattice has a spacing</text>
    <text x="160" y="0" fill="#dc2626">✓ Unique</text><text x="160" y="15" fill="#888" font-size="10">no other speed self-consistent</text>
    <text x="320" y="0" fill="#16a34a">✓ Invariant</text><text x="320" y="15" fill="#888" font-size="10">all examiners equivalent</text>
  </g>
</svg>
