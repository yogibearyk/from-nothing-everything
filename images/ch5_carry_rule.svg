<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" font-family="'Courier New', monospace">
  <rect width="500" height="200" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="14" fill="#444" font-family="Georgia, serif">The Carry Rule: 11 → 100</text>
  <!-- Before carry -->
  <g transform="translate(80,70)">
    <text x="0" y="0" font-size="13" fill="#888" font-family="Georgia">before:</text>
    <rect x="70" y="-18" width="30" height="26" fill="#3b82f6" rx="4"/>
    <text x="85" y="2" text-anchor="middle" font-size="16" fill="white" font-weight="bold">1</text>
    <rect x="105" y="-18" width="30" height="26" fill="#3b82f6" rx="4"/>
    <text x="120" y="2" text-anchor="middle" font-size="16" fill="white" font-weight="bold">1</text>
    <rect x="140" y="-18" width="30" height="26" fill="#e2e8f0" rx="4"/>
    <text x="155" y="2" text-anchor="middle" font-size="16" fill="#94a3b8">0</text>
    <text x="85" y="25" text-anchor="middle" font-size="10" fill="#666">φ¹</text>
    <text x="120" y="25" text-anchor="middle" font-size="10" fill="#666">φ²</text>
    <text x="155" y="25" text-anchor="middle" font-size="10" fill="#666">φ³</text>
  </g>
  <!-- Arrow -->
  <text x="250" y="85" text-anchor="middle" font-size="20" fill="#aaa">↓</text>
  <text x="290" y="85" font-size="11" fill="#999" font-family="Georgia">φ¹ + φ² = φ³</text>
  <!-- After carry -->
  <g transform="translate(80,130)">
    <text x="0" y="0" font-size="13" fill="#888" font-family="Georgia">after:</text>
    <rect x="70" y="-18" width="30" height="26" fill="#e2e8f0" rx="4"/>
    <text x="85" y="2" text-anchor="middle" font-size="16" fill="#94a3b8">0</text>
    <rect x="105" y="-18" width="30" height="26" fill="#e2e8f0" rx="4"/>
    <text x="120" y="2" text-anchor="middle" font-size="16" fill="#94a3b8">0</text>
    <rect x="140" y="-18" width="30" height="26" fill="#f59e0b" rx="4"/>
    <text x="155" y="2" text-anchor="middle" font-size="16" fill="white" font-weight="bold">1</text>
    <text x="85" y="25" text-anchor="middle" font-size="10" fill="#666">φ¹</text>
    <text x="120" y="25" text-anchor="middle" font-size="10" fill="#666">φ²</text>
    <text x="155" y="25" text-anchor="middle" font-size="10" fill="#666">φ³</text>
  </g>
  <text x="250" y="185" text-anchor="middle" font-size="12" fill="#888" font-family="Georgia, serif">two adjacent 1s combine and carry — the engine of everything</text>
</svg>
