<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#fafafa"/>
  <text x="250" y="22" text-anchor="middle" font-size="15" fill="#444">The Mass Ladder: Every Rung from the Same Ratio</text>
  <!-- Vertical axis -->
  <line x1="80" y1="40" x2="80" y2="300" stroke="#ddd" stroke-width="1"/>
  <text x="75" y="50" text-anchor="end" font-size="10" fill="#999">heavy</text>
  <text x="75" y="295" text-anchor="end" font-size="10" fill="#999">light</text>
  <!-- Mass rungs (log scale, approximate) -->
  <g font-size="11">
    <!-- Top quark -->
    <rect x="90" y="45" width="180" height="18" fill="#dc2626" opacity="0.8" rx="3"/>
    <text x="280" y="58" fill="#555">top quark: 172.7 GeV</text>
    <!-- Higgs -->
    <rect x="90" y="68" width="160" height="18" fill="#f59e0b" opacity="0.8" rx="3"/>
    <text x="260" y="81" fill="#555">Higgs: 125.25 GeV</text>
    <!-- W/Z -->
    <rect x="90" y="91" width="145" height="18" fill="#3b82f6" opacity="0.8" rx="3"/>
    <text x="245" y="104" fill="#555">W: 80.4, Z: 91.2 GeV</text>
    <!-- Bottom -->
    <rect x="90" y="130" width="80" height="14" fill="#dc2626" opacity="0.6" rx="3"/>
    <text x="180" y="141" fill="#555">bottom: 4.18 GeV</text>
    <!-- Tau -->
    <rect x="90" y="148" width="65" height="14" fill="#6366f1" opacity="0.6" rx="3"/>
    <text x="165" y="159" fill="#555">tau: 1.78 GeV</text>
    <!-- Charm -->
    <rect x="90" y="166" width="60" height="14" fill="#dc2626" opacity="0.5" rx="3"/>
    <text x="160" y="177" fill="#555">charm: 1.27 GeV</text>
    <!-- Muon/strange -->
    <rect x="90" y="200" width="30" height="12" fill="#6366f1" opacity="0.4" rx="2"/>
    <text x="130" y="210" fill="#555" font-size="10">muon: 106 MeV</text>
    <rect x="90" y="215" width="27" height="12" fill="#dc2626" opacity="0.4" rx="2"/>
    <text x="127" y="225" fill="#555" font-size="10">strange: 93 MeV</text>
    <!-- Up/down -->
    <rect x="90" y="248" width="8" height="10" fill="#dc2626" opacity="0.3" rx="2"/>
    <text x="108" y="257" fill="#555" font-size="10">up/down: 2-5 MeV</text>
    <!-- Electron -->
    <rect x="90" y="270" width="5" height="10" fill="#6366f1" opacity="0.3" rx="2"/>
    <text x="105" y="279" fill="#555" font-size="10">electron: 0.511 MeV</text>
  </g>
  <!-- Legend -->
  <rect x="350" y="250" width="12" height="12" fill="#dc2626" opacity="0.6" rx="2"/>
  <text x="370" y="260" font-size="10" fill="#888">quarks</text>
  <rect x="350" y="268" width="12" height="12" fill="#6366f1" opacity="0.6" rx="2"/>
  <text x="370" y="278" font-size="10" fill="#888">leptons</text>
  <rect x="350" y="286" width="12" height="12" fill="#3b82f6" opacity="0.6" rx="2"/>
  <text x="370" y="296" font-size="10" fill="#888">gauge bosons</text>
  <text x="250" y="312" text-anchor="middle" font-size="11" fill="#888">all derived from φ, ⊙, and the tower — zero adjustable parameters</text>
</svg>
