<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">Fibonacci Polygons Converge to the Circle</text>
  <!-- Three stages of polygon refinement -->
  <!-- Stage 1: triangle (3 sides) -->
  <g transform="translate(90,140)">
    <polygon points="0,-50 -43,25 43,25" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="75" text-anchor="middle" font-size="12" fill="#666">3 sides</text>
    <text x="0" y="90" text-anchor="middle" font-size="11" fill="#999">≈ 2.598</text>
  </g>
  <!-- Stage 2: pentagon (5 sides) -->
  <g transform="translate(250,140)">
    <polygon points="0,-50 -47.6,-15.5 -29.4,40.5 29.4,40.5 47.6,-15.5" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="75" text-anchor="middle" font-size="12" fill="#666">5 sides</text>
    <text x="0" y="90" text-anchor="middle" font-size="11" fill="#999">≈ 2.939</text>
  </g>
  <!-- Stage 3: 13-gon -->
  <g transform="translate(410,140)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="75" text-anchor="middle" font-size="12" fill="#666">∞ sides</text>
    <text x="0" y="90" text-anchor="middle" font-size="11" fill="#999">→ ⊙ = π</text>
  </g>
  <!-- Arrow progression -->
  <text x="170" y="145" font-size="20" fill="#bbb">→</text>
  <text x="330" y="145" font-size="20" fill="#bbb">→</text>
  <text x="250" y="235" text-anchor="middle" font-size="12" fill="#888">Fibonacci-sided polygons refine toward ⊙ = π</text>
</svg>
