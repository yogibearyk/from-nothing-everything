<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Self-Referential Fixed Point</text>
  <!-- Circular arrow showing self-reference -->
  <g transform="translate(250,130)">
    <!-- The loop -->
    <path d="M-80,-30 A90,90 0 1,1 -80,30" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#bluearrow)"/>
    <defs><marker id="bluearrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/></marker></defs>
    <!-- Labels around the loop -->
    <text x="80" y="-30" font-size="12" fill="#555">the mass determines</text>
    <text x="80" y="-12" font-size="12" fill="#555">the screening depth</text>
    <text x="80" y="20" font-size="12" fill="#555">which determines</text>
    <text x="80" y="38" font-size="12" fill="#555">the coupling</text>
    <text x="-120" y="20" font-size="12" fill="#555">which determines</text>
    <text x="-120" y="38" font-size="12" fill="#555">the mass...</text>
    <!-- The fixed point -->
    <circle cx="0" cy="0" r="30" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="white" font-weight="bold">f* = 1.709</text>
  </g>
  <!-- Result -->
  <text x="250" y="220" text-anchor="middle" font-size="13" fill="#555">the loop closes at exactly ONE value → v = 246.22 GeV (0.66 ppm)</text>
</svg>
