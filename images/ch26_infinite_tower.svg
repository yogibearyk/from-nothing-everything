<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Infinite Tower: Converging to 1/⊙</text>
  <!-- Tower stages fading upward -->
  <g transform="translate(100,50)">
    <!-- Stage 6 (brightest) -->
    <rect x="0" y="0" width="200" height="28" fill="#3b82f6" opacity="0.9" rx="4"/>
    <text x="100" y="19" text-anchor="middle" font-size="12" fill="white">Stage 6: Our Universe (8)</text>
    <text x="220" y="19" font-size="11" fill="#555">← we are here</text>
    <!-- Stage 7 -->
    <rect x="15" y="35" width="170" height="25" fill="#4f46e5" opacity="0.7" rx="4"/>
    <text x="100" y="52" text-anchor="middle" font-size="11" fill="white">Stage 7: Dark Sector (13)</text>
    <!-- Stage 8 -->
    <rect x="30" y="67" width="140" height="22" fill="#6366f1" opacity="0.5" rx="4"/>
    <text x="100" y="82" text-anchor="middle" font-size="10" fill="white">Stage 8 (21)</text>
    <!-- Stage 9 -->
    <rect x="42" y="95" width="116" height="20" fill="#7c3aed" opacity="0.4" rx="4"/>
    <text x="100" y="109" text-anchor="middle" font-size="10" fill="white">Stage 9 (34)</text>
    <!-- Stage 10 -->
    <rect x="52" y="120" width="96" height="18" fill="#8b5cf6" opacity="0.3" rx="3"/>
    <text x="100" y="133" text-anchor="middle" font-size="9" fill="white">Stage 10 (55)</text>
    <!-- Stage 11 -->
    <rect x="60" y="143" width="80" height="16" fill="#a78bfa" opacity="0.25" rx="3"/>
    <text x="100" y="155" text-anchor="middle" font-size="9" fill="white">Stage 11 (89)</text>
    <!-- Dots -->
    <text x="100" y="175" text-anchor="middle" font-size="14" fill="#c4b5fd">⋮</text>
    <text x="100" y="195" text-anchor="middle" font-size="11" fill="#c4b5fd">∞ stages</text>
  </g>
  <!-- The convergence -->
  <g transform="translate(250,230)">
    <rect x="-130" y="-20" width="260" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="0" y="5" text-anchor="middle" font-size="15" fill="#92400e">total content → 1/⊙ = 1/π</text>
  </g>
  <text x="250" y="275" text-anchor="middle" font-size="11" fill="#888">infinite in stages, finite in content — the journey from Ω back to Ω</text>
</svg>
