<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">Growth by Fibonacci: Each = Sum of the Two Before</text>
  <!-- Fibonacci tree -->
  <!-- Stage labels on left -->
  <text x="30" y="65" font-size="11" fill="#999">stage 1:</text>
  <text x="30" y="105" font-size="11" fill="#999">stage 2:</text>
  <text x="30" y="145" font-size="11" fill="#999">stage 3:</text>
  <text x="30" y="185" font-size="11" fill="#999">stage 4:</text>
  <text x="30" y="225" font-size="11" fill="#999">stage 5:</text>
  <text x="30" y="265" font-size="11" fill="#999">stage 6:</text>
  <!-- Circles for each stage's count -->
  <g fill="#3b82f6" font-size="14" text-anchor="middle">
    <!-- Stage 1: 1 -->
    <circle cx="200" cy="60" r="12" opacity="0.8"/><text x="200" y="65" fill="white" font-size="13">1</text>
    <!-- Stage 2: 1 -->
    <circle cx="200" cy="100" r="12" opacity="0.8"/><text x="200" y="105" fill="white" font-size="13">1</text>
    <!-- Stage 3: 2 -->
    <circle cx="180" cy="140" r="12" opacity="0.8"/><text x="180" y="145" fill="white" font-size="13">1</text>
    <circle cx="220" cy="140" r="12" opacity="0.8"/><text x="220" y="145" fill="white" font-size="13">1</text>
    <!-- Stage 4: 3 -->
    <circle cx="160" cy="180" r="12" opacity="0.8"/><circle cx="200" cy="180" r="12" opacity="0.8"/><circle cx="240" cy="180" r="12" opacity="0.8"/>
    <!-- Stage 5: 5 -->
    <circle cx="120" cy="220" r="12" opacity="0.7"/><circle cx="160" cy="220" r="12" opacity="0.7"/><circle cx="200" cy="220" r="12" opacity="0.7"/><circle cx="240" cy="220" r="12" opacity="0.7"/><circle cx="280" cy="220" r="12" opacity="0.7"/>
    <!-- Stage 6: 8 -->
    <circle cx="100" cy="260" r="10" opacity="0.6"/><circle cx="130" cy="260" r="10" opacity="0.6"/><circle cx="160" cy="260" r="10" opacity="0.6"/><circle cx="190" cy="260" r="10" opacity="0.6"/><circle cx="220" cy="260" r="10" opacity="0.6"/><circle cx="250" cy="260" r="10" opacity="0.6"/><circle cx="280" cy="260" r="10" opacity="0.6"/><circle cx="310" cy="260" r="10" opacity="0.6"/>
  </g>
  <!-- Count labels on right -->
  <text x="380" y="65" font-size="14" fill="#555" font-weight="bold">1</text>
  <text x="380" y="105" font-size="14" fill="#555" font-weight="bold">1</text>
  <text x="380" y="145" font-size="14" fill="#555" font-weight="bold">2</text><text x="405" y="145" font-size="11" fill="#999">= 1+1</text>
  <text x="380" y="185" font-size="14" fill="#555" font-weight="bold">3</text><text x="405" y="185" font-size="11" fill="#999">= 1+2</text>
  <text x="380" y="225" font-size="14" fill="#555" font-weight="bold">5</text><text x="405" y="225" font-size="11" fill="#999">= 2+3</text>
  <text x="380" y="265" font-size="14" fill="#555" font-weight="bold">8</text><text x="405" y="265" font-size="11" fill="#999">= 3+5</text>
  <!-- Connection lines -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="200" y1="72" x2="200" y2="88"/>
    <line x1="200" y1="112" x2="180" y2="128"/><line x1="200" y1="112" x2="220" y2="128"/>
    <line x1="180" y1="152" x2="160" y2="168"/><line x1="220" y1="152" x2="200" y2="168"/><line x1="220" y1="152" x2="240" y2="168"/>
  </g>
</svg>
