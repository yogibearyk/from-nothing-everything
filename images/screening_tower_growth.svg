<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <title>The screening tower grows through Fibonacci stages</title>
  <desc>Six towers showing stages 1 through 6, with depths 1, 1, 2, 3, 5, and 8 blocks. Each block is a position that screens the coupling. More blocks means weaker apparent coupling, shown by fading arrows.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .label { font-size: 13px; fill: #5F5E5A; font-weight: 400; }
    .title { font-size: 14px; fill: #2C2C2A; font-weight: 500; }
    .num { font-size: 20px; fill: #2C2C2A; font-weight: 500; }
    .stage { font-size: 11px; fill: #888780; font-weight: 400; }
    .note { font-size: 12px; fill: #5F5E5A; font-weight: 400; }
    .block { rx: 3; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #B4B2A9; }
      .title { fill: #D3D1C7; }
      .num { fill: #D3D1C7; }
      .stage { fill: #888780; }
      .note { fill: #B4B2A9; }
    }
  </style>

  <!-- Title -->
  <text class="title" x="340" y="30" text-anchor="middle">The screening tower grows through Fibonacci stages</text>

  <!-- Stage labels -->
  <text class="stage" x="72" y="60" text-anchor="middle">Stage 1</text>
  <text class="stage" x="168" y="60" text-anchor="middle">Stage 2</text>
  <text class="stage" x="264" y="60" text-anchor="middle">Stage 3</text>
  <text class="stage" x="360" y="60" text-anchor="middle">Stage 4</text>
  <text class="stage" x="472" y="60" text-anchor="middle">Stage 5</text>
  <text class="stage" x="600" y="60" text-anchor="middle">Stage 6</text>

  <!-- Depth labels -->
  <text class="num" x="72" y="90" text-anchor="middle">1</text>
  <text class="num" x="168" y="90" text-anchor="middle">1</text>
  <text class="num" x="264" y="90" text-anchor="middle">2</text>
  <text class="num" x="360" y="90" text-anchor="middle">3</text>
  <text class="num" x="472" y="90" text-anchor="middle">5</text>
  <text class="num" x="600" y="90" text-anchor="middle">8</text>

  <!-- Blocks - Stage 1 (depth 1) -->
  <rect class="block" x="47" y="340" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>

  <!-- Stage 2 (depth 1) -->
  <rect class="block" x="143" y="340" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>

  <!-- Stage 3 (depth 2) -->
  <rect class="block" x="239" y="340" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="239" y="300" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>

  <!-- Stage 4 (depth 3) - triangle -->
  <rect class="block" x="335" y="340" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="335" y="300" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="335" y="260" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>

  <!-- Stage 5 (depth 5) -->
  <rect class="block" x="447" y="340" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="447" y="300" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="447" y="260" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="447" y="220" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="447" y="180" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>

  <!-- Stage 6 (depth 8) -->
  <rect class="block" x="575" y="340" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="300" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="260" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="220" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="180" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="140" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="100" width="50" height="36" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <rect class="block" x="575" y="60" width="50" height="36" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>

  <!-- Observer eye at bottom -->
  <text class="label" x="340" y="400" text-anchor="middle">↑ observer looks up through the tower ↑</text>

  <!-- Baseline -->
  <line x1="30" y1="380" x2="650" y2="380" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Annotations -->
  <text class="note" x="360" y="430" text-anchor="middle">Triangle closes</text>
  <line x1="360" y1="433" x2="360" y2="254" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Screening explanation arrows -->
  <text class="note" x="72" y="470" text-anchor="middle">1 layer</text>
  <text class="note" x="72" y="484" text-anchor="middle">strong coupling</text>

  <text class="note" x="600" y="470" text-anchor="middle">8 layers</text>
  <text class="note" x="600" y="484" text-anchor="middle">weak coupling</text>

  <!-- Arrow showing progression -->
  <line x1="120" y1="476" x2="548" y2="476" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text class="note" x="340" y="504" text-anchor="middle">more screening → weaker apparent force</text>
</svg>
