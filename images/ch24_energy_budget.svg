<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Georgia, serif">
  <rect width="500" height="250" fill="#fafafa"/>
  <text x="250" y="25" text-anchor="middle" font-size="15" fill="#444">The Energy Budget of the Universe</text>
  <!-- Pie chart approximation using arcs -->
  <g transform="translate(170,140)">
    <!-- Dark energy ~68% -->
    <path d="M0,0 L0,-80 A80,80 0 1,1 -76,-24 Z" fill="#4f46e5" opacity="0.7"/>
    <!-- Dark matter ~27% -->
    <path d="M0,0 L-76,-24 A80,80 0 0,1 -30,74 Z" fill="#6366f1" opacity="0.5"/>
    <!-- Ordinary matter ~5% -->
    <path d="M0,0 L-30,74 A80,80 0 0,1 0,-80 Z" fill="#3b82f6" opacity="0.8"/>
  </g>
  <!-- Labels -->
  <g font-size="13">
    <text x="320" y="80" fill="#4f46e5" font-weight="bold">Dark Energy: 68.3%</text>
    <text x="320" y="98" fill="#888" font-size="10">= 1 − D² − Ω_b (derived)</text>
    <text x="320" y="130" fill="#6366f1" font-weight="bold">Dark Matter: 26.5%</text>
    <text x="320" y="148" fill="#888" font-size="10">= D² = (φ/⊙)² (the Drishti bound squared)</text>
    <text x="320" y="180" fill="#3b82f6" font-weight="bold">Ordinary Matter: 4.9%</text>
    <text x="320" y="198" fill="#888" font-size="10">= tower counting (baryon/photon ratio)</text>
  </g>
  <text x="250" y="240" text-anchor="middle" font-size="12" fill="#888">the observation limit itself becomes the dark matter fraction</text>
</svg>
